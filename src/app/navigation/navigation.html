<header>
    <img
        src="/images/unicorn.apng"
        alt="Unicorn Logo" />
    <h1>
        <a routerLink="/">Unicorn Farm</a>
    </h1>
    <nav>
        <a
            routerLink="/licornes"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}"
            >Liste des licornes</a
        >
        <a
            routerLink="/enregistrer"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}"
            >Enregistrer une licorne</a
        >
    </nav>
    <span class="icons8">Icons by <a href="https://icons8.com/">Icons8</a></span>
</header>
